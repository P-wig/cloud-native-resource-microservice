worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ACA Ingress uses these ranges; keeping these is good practice
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=1r/s;

    # Send logs to stdout/stderr so they show up in Azure Log Analytics
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        # ACA internal ingress will hit this port
        listen 8080; 
        http2 on;

        location / {
            limit_req zone=grpc_limit burst=10 nodelay;
            limit_req_status 429;

            # Use SNI for upstream TLS handshake against ACA ingress.
            grpc_ssl_server_name on;
            grpc_ssl_name team6.internal.wonderfulpond-ecedce94.northcentralus.azurecontainerapps.io;

            # Allow more time for cold starts and first-hop upstream connection.
            grpc_connect_timeout 15s;
            grpc_send_timeout 120s;
            grpc_read_timeout 120s;

            grpc_set_header Host team6.internal.wonderfulpond-ecedce94.northcentralus.azurecontainerapps.io;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
            
            # Route to the internal gRPC service inside the ACA environment.
            grpc_pass grpcs://team6.internal.wonderfulpond-ecedce94.northcentralus.azurecontainerapps.io:443;
        }
    }
}
