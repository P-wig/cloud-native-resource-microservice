# Nginx configuration for gRPC reverse proxy with rate limiting

# Sets worker count based on available CPU cores
worker_processes auto;

# each worker can process 1024 connections concurrently
events {
    worker_connections 1024;
}

http {
    # Rate limit zone: keyed by client IP, 10MB memory, 1 request/second (60/min)
    limit_req_zone $binary_remote_addr zone=grpc_limit:10m rate=1r/s;

    # Structured access log format
    log_format grpc_log '$remote_addr [$time_local] "$request" '
                        '$status $body_bytes_sent ${request_time}s';

    server {
        # Listen on port 50051 for gRPC traffic, using HTTP/2
        listen 50051;
        http2 on;

        # Log gRPC requests and errors to separate files
        access_log /var/log/nginx/grpc_access.log grpc_log;
        error_log  /var/log/nginx/grpc_error.log warn;

        location / {
            # Allow burst of 10 requests, reject excess immediately
            limit_req zone=grpc_limit burst=10 nodelay;

            # Return 429 when rate limited
            limit_req_status 429;

            # forwards gRPC requests to the hardware-service on port 50052
            grpc_pass grpc://hardware-service:50052;
        }
    }
}