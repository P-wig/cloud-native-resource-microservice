name: hardware-microservice

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  hardware-service:
    build:
      context: .
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=hardware_service
      - GRPC_PORT=50052
    depends_on:
      - mongo
    volumes:
      - ./app:/app/app
      - ./run.py:/app/run.py

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "50051:50051"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx 
    depends_on:
      - hardware-service

volumes:
  mongo_data:
